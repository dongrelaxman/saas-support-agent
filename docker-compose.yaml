services:

  # ── Postgres ────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16
    container_name: langgraph-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agentdb
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agentdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── FastAPI backend ──────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: taskpilot-backend
    env_file: .env                        # OPENAI_API_KEY, WEAVIATE_*, LANGCHAIN_*, etc.
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/agentdb
      PORT: "8001"
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ── React frontend (nginx) ───────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: taskpilot-frontend
    environment:
      BACKEND_URL: http://backend:8001   # nginx substitutes this into nginx.conf
    ports:
      - "3000:80"                        # visit http://localhost:3000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
